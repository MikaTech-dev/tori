<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be My Valentine?</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        /* Smooth transition for the growing button */
        #Yes { transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen gap-4 text-center">
    
    <div id="image-container" class="flex flex-col items-center">
        <img src="https://media1.tenor.com/m/fZOnOwnmrtIAAAAC/wsg-fine-shyt.gif" alt="please" class="w-48 js-first-gif">
        <img src="https://media.tenor.com/MfFIt2lM3d4AAAAj/cryog.gif" alt="sad" class="w-48 hidden js-second-gif">
        <img src="https://media.tenor.com/arTD_7WOs_QAAAAi/crying-sobbing.gif" alt="crying" class="w-48 hidden js-third-gif">
    </div>

    <h1 class="text-2xl font-bold pt-3" id="main-text">Will you be my Valentine?</h1>
    
    <div class="flex flex-wrap items-center justify-center gap-4 py-3">
        <button type="button" class="bg-green-500 px-6 py-3 rounded-3xl text-white font-bold cursor-pointer hover:bg-green-600 focus:outline-green-500" id="Yes">
            Yes!!
        </button>

        <button type="button" class="bg-red-500 px-6 py-3 rounded-3xl text-white font-bold cursor-pointer hover:bg-red-600 focus:outline-red-500" id="No">
            No
        </button>
    </div>

    <div class="mt-10">
        <button type="button" class="cursor-pointer bg-purple-500 px-4 py-2 rounded-xl text-white text-sm hover:bg-purple-600" id="Unhide">
            (Debug) Unhide All
        </button>
    </div>

<script>
    const yesBtn = document.querySelector('#Yes');
    const noBtn = document.querySelector('#No');
    const unhideBtn = document.querySelector('#Unhide');
    const allImages = document.querySelectorAll("img");
    const mainText = document.querySelector('#main-text');

    const rejectionTexts = [
        "Are you sure?",
        "Really sure?",
        "Think again!",
        "Last chance!",
        "Surely not?",
        "You might regret this!",
        "Give it another thought!",
        "Are you absolutely certain?",
        "This could be a mistake!",
        "Have a heart!",
        "Don't be so cold!",
        "Change of heart?",
        "Wouldn't you reconsider?",
        "Is that your final answer?",
        "You're breaking my heart ;("
    ];

    let textIndex = 0;
    let currentScale = 1;

    // 2. "No" Button Logic
    noBtn.addEventListener('click', () => {
        // Grow the Yes button
        currentScale += 0.4; 
        yesBtn.style.transform = `scale(${currentScale})`;

        // Change the No button text
        noBtn.textContent = rejectionTexts[textIndex];
        
        // Cycle through texts (loop back to start if we run out)
        textIndex = (textIndex + 1) % rejectionTexts.length;
    });

    // 3. "Yes" Button Logic (Optional: Make it alert or change page)
    yesBtn.addEventListener('click', () => {
        mainText.textContent = "I KNEW IT!!! ❤️";
        yesBtn.style.display = "none"
        noBtn.style.display = 'none'; // Hide the No button
        unhideBtn.style.display = 'none';
        
        // Reset images to show only the happy one or a new one
        allImages.forEach(img => img.classList.add('hidden'));
        document.querySelector('.js-first-gif').src = "https://media.tenor.com/gUiu1zyxfzYAAAAi/bear-kiss-bear-kisses.gif"; // Switch to kissing bears
        document.querySelector('.js-first-gif').classList.remove('hidden');
    });

    // 4. Unhide Logic
    unhideBtn.addEventListener("click", ()=> {
        allImages.forEach((img) => {
            img.classList.remove('hidden');
            img.style.border = "3px solid purple";
        });
        unhideBtn.textContent = "Images Revealed!";
    });

</script>
</body>
</html>

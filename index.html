<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be My Valentine?</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/js-confetti@latest/dist/js-confetti.browser.js"></script>
    <style>
        /* Smooth transition for the growing button */
        #Yes { transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        body { background-color: #fff5f5; }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen gap-4 text-center p-4">
    
    <div id="image-container" class="flex flex-col items-center min-h-[200px] justify-center">
        <img src="https://media1.tenor.com/m/fZOnOwnmrtIAAAAC/wsg-fine-shyt.gif" alt="please" class="w-48 js-first-gif">
    </div>

    <h1 class="text-3xl font-bold pt-3 text-pink-600" id="main-text">Will you be my Valentine?</h1>
    
    <div class="flex flex-wrap items-center justify-center gap-4 py-3 min-h-[150px]">
        <button type="button" class="bg-green-500 px-6 py-3 rounded-3xl text-white font-bold cursor-pointer hover:bg-green-600 shadow-lg" id="Yes">
            Yes!!
        </button>

        <button type="button" class="bg-red-500 px-6 py-3 rounded-3xl text-white font-bold cursor-pointer hover:bg-red-600 shadow-md" id="No">
            No
        </button>
    </div>
<script>
    const yesBtn = document.querySelector('#Yes');
    const noBtn = document.querySelector('#No');
    const mainImg = document.querySelector('.js-first-gif');
    const mainText = document.querySelector('#main-text');

    // 1. Initialize JSConfetti 
    const jsConfetti = new JSConfetti();

    const rejectionTexts = [
        "Are you sure?",
        "Really sure?",
        "Think again!",
        "Last chance!",
        "Surely not?",
        "You're breaking my heart ;(",
        "Are you sure? 😰",
        "Give it another thought!",
        "Are you absolutely certain?",
        "Have a heart!",
        "Don't be so cold!",
        "Change of heart?",
        "Wouldn't you reconsider?",
        "Is that your final answer?",
    ];

    let textIndex = 0;
    let currentScale = 1;

    // 2. "No" Button Logic
    noBtn.addEventListener('click', () => {
        currentScale += 0.4; 
        yesBtn.style.transform = `scale(${currentScale})`;
        noBtn.textContent = rejectionTexts[textIndex];
        textIndex = (textIndex + 1) % rejectionTexts.length;
        
        // Optional: Change image to sad one when they click no
        mainImg.src = "https://media.tenor.com/MfFIt2lM3d4AAAAj/cryog.gif";
    });

    // 3. "Yes" Button Logic
    yesBtn.addEventListener('click', () => {
        mainText.textContent = "YAYYYYYYYYYYYYYYYYYY ILYSM!!! ❤️";
        yesBtn.style.display = "none";
        noBtn.style.display = 'none'; 
        mainImg.src = "https://media.tenor.com/gUiu1zyxfzYAAAAi/bear-kiss-bear-kisses.gif"; 

        jsConfetti.addConfetti({
            confettiColors: ['#ff0a54', '#ff477e', '#ff7096', '#fb6f92', '#ff85a1', '#fbb1bd'],
            confettiRadius: 6,
            confettiNumber: 500,
        });

        // Second burst after a tiny delay for "depth"
        setTimeout(() => {
            jsConfetti.addConfetti({
                emojiSize: 25,
                confettiNumber: 20,
            });
        }, 300);
    });

</script>
</body>
</html>
